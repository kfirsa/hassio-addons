---
version: 1.3.4
slug: extended_cups
name: Extended CUPS Print Server
description: CUPS print server with automatic printer discovery, network printing, USB printer support, Gutenprint universal drivers, and built-in thermal printer drivers (ZJ-58, Epson TM series, Star Micronics, and more)
url: https://github.com/kfirsa/hassio-addons
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
hassio_api: true
host_network: true
usb: true  # Enable USB device access for thermal printers
map:
  - data:rw
  - share:rw
init: false
ports:
  631/tcp: 631
ports_description:
  631/tcp: CUPS web interface and printing port
options:
  admin_username: "admin"
  admin_password: "admin"
  ppd_urls:
    - "https://www.openprinting.org/download/PPD/HP/hp-laserjet_1020.ppd"
    - "https://www.openprinting.org/download/PPD/Brother/brother-ql800.ppd"
schema:
  admin_username: str
  admin_password: password
  ppd_urls:
    - str
startup: services
