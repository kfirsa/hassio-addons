---
version: 1.2.3
slug: extended_cups
name: Extended CUPS Print Server
description: CUPS print server with network printing, USB printer support, and built-in thermal printer drivers
url: https://github.com/kfirsa/hassio-addons
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
hassio_api: true
host_network: true
usb: true  # Enable USB device access for thermal printers
map:
  - data:rw
  - share:rw
init: false
ports:
  631/tcp: 631
ports_description:
  631/tcp: CUPS web interface and printing port
options:
  admin_username: "admin"
  admin_password: "admin"
  ppd_urls:
    - "https://www.openprinting.org/download/PPD/HP/hp-laserjet_1020.ppd"
    - "https://www.openprinting.org/download/PPD/HP/hp-laserjet_p1005.ppd"
    - "https://www.openprinting.org/download/PPD/Brother/brother-ql800.ppd"
    - "https://www.openprinting.org/download/PPD/Brother/brother-hl2270dw.ppd"
    - "https://www.openprinting.org/download/PPD/Canon/canon-pixma_mp250.ppd"
    - "https://www.openprinting.org/download/PPD/Epson/epson-stylus_photo_r2000.ppd"
schema:
  admin_username: str
  admin_password: password
  ppd_urls:
    - str
startup: services
