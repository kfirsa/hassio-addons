---
name: Audio Cast Bridge
version: 1.1.2
slug: audio_cast_bridge
description: Cast V2 bridge for LinkPlay and DLNA speakers without native Google Cast
url: https://github.com/kfirsa/hassio-addons
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
stage: experimental
hassio_api: true
homeassistant_api: true
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:cast-audio
panel_title: Audio Cast Bridge
map:
  - data:rw
  - addon_config:rw
  - share:ro
options:
  max_bridges: 2
  max_concurrent_streams: 2
  stream_port: 18080
  dial_base_port: 3100
  log_level: INFO
  certificate_path: ""
  stream_host: ""
schema:
  max_bridges: int(1,16)
  max_concurrent_streams: int(1,8)
  stream_port: port
  dial_base_port: port
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  certificate_path: str
  stream_host: str
