---
name: Icecast
version: 1.0.3
slug: icecast
description: Icecast streaming server with Home Assistant Ingress admin UI
url: https://github.com/kfirsa/hassio-addons
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
startup: services
boot: auto
init: false
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:radio-tower
panel_title: Icecast
map:
  - data:rw
  - addon_config:rw
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Icecast streams (sources and listeners)
options:
  location: "Home"
  admin: "admin@example.com"
  max_clients: 100
  max_sources: 10
  source_timeout: 86400
schema:
  source_password: password
  relay_password: password
  admin_password: password
  hostname: str?
  location: str
  admin: str
  max_clients: int
  max_sources: int
  source_timeout: int
